name: concurrency-integrity-p0
services:
  db:
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: lab_p0
      POSTGRES_DB: concurrency_integrity_p0
      # Disposable synthetic DB, reachable only through a loopback port.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql:size=268435456
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_p0 -d concurrency_integrity_p0"]
      interval: 1s
      timeout: 2s
      retries: 30
